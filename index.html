<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Is He Come Hub</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#6b6b6b;--card:#f3f3f6;--line:#dcdce2;--acc:#2f6fed;--acc2:#8b5cf6;--sh:0 1px 2px rgba(0,0,0,.06),0 8px 22px rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15151a;--fg:#f0f0f2;--mut:#9a9aa5;--card:#22222a;--line:#34343e;--acc:#6b9bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15151a;--fg:#f0f0f2;--mut:#9a9aa5;--card:#22222a;--line:#34343e;--acc:#6b9bff;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 320px at 50% -90px,color-mix(in srgb,var(--acc) 18%,transparent),transparent) no-repeat,var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px;max-width:560px;margin-inline:auto}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:14px;margin-bottom:20px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:var(--sh);position:relative;overflow:hidden;transition:transform .1s}
.tile:active{transform:scale(.98)}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:linear-gradient(90deg,var(--acc),var(--acc2))}
.ic{font-size:34px}
.tt{font-size:20px;font-weight:700;margin:6px 0 2px}
.ds{color:var(--mut);font-size:13.5px}
.go{margin-top:12px;font-weight:700;color:var(--acc);font-size:14px}
.back{display:inline-block;margin-bottom:6px;font-size:13px;font-weight:600;color:var(--acc);text-decoration:none}
</style></head><body>
<h1>Is He Come Hub</h1>
<div class="sub">Pick a competition to see the stats.</div>
<a class="tile" href="fpl.html"><div class="ic">⚽</div><div class="tt">Fantasy Premier League</div><div class="ds" id="fplsub">Leader: Rich Walker · 589 pts after GW9</div><div class="go">View stats →</div></a>
<a class="tile" href="accumulator.html"><div class="ic">🎰</div><div class="tt">Accumulator challenge</div><div class="ds">£2 accumulator rounds: results, picks and awards</div><div class="go">View stats →</div></a>
<script>
fetch('data.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
 delete d._updated;
 const t=Object.values(d).map(x=>({m:x.manager,p:x.gws[x.gws.length-1][0],g:x.gws.length})).sort((a,b)=>b.p-a.p);
 document.getElementById('fplsub').textContent='Leader: '+t[0].m+' · '+t[0].p+' pts after GW'+t[0].g;
}).catch(()=>{});
</script></body></html>
