@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1611;--fg:#eef3ee;--mut:#a3b8aa;--card:#15241b;--line:#2a3d31;--acc:#c6f432}}

h1{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:44px;line-height:.95;text-transform:uppercase;letter-spacing:0;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--fg)}

.ax{fill:var(--mut)}

.tile{border-radius:14px}
.ic{font-size:30px}
.tt{font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:.01em}
