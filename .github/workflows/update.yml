name: Update FPL data
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python update_data.py
      - run: python update_players.py
        continue-on-error: true
      - run: |
          git config user.name "fpl-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data.json accumulator.csv player_stats.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --staged --quiet; then git commit -m "Update data"; git push; fi
