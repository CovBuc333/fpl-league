name: Update FPL data
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python update_data.py
      - run: |
          git config user.name "fpl-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          if ! git diff --staged --quiet; then git commit -m "Update FPL data"; git push; fi
